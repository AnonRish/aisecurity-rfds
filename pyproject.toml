[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisecurity-rfds"
version = "0.1.0"
description = "Reference implementations, simulations and design analyses for the AI Security Forum RFDs (projects.aisecurity.forum)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pytest-timeout>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider --import-mode=importlib"
timeout = 300
markers = [
    "slow: slower statistical or benchmark tests (still deterministic under fixed seeds)",
]
