[[mutation]]
name = "lot size changed in the audit section"
file = "__main__.py"
pattern = 'LOT = 100_000'
replace = 'LOT = 50_000'

[[mutation]]
name = "defect-density sweep changed"
file = "__main__.py"
pattern = 'D0_SWEEP = (0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 4.0)'
replace = 'D0_SWEEP = (0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 3.0)'

[[mutation]]
name = "tier-gap sweep changed"
file = "__main__.py"
pattern = 'GAPS = (18, 12, 6, 3)'
replace = 'GAPS = (18, 12, 6, 4)'
