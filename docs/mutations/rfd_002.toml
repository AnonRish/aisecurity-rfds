# Seeded bugs for RFD 002. Run: python scripts/mutation_check.py 2
# Each entry breaks one claim of the README in one place; the package's tests must notice every one.

# ---- moe.py: numerics, routing, the forward and backward passes, training, quantization ----------------------------

[[mutation]]
name = "softmax does not subtract the row maximum"
file = "moe.py"
pattern = 'e = np.exp(z - z.max(axis=-1, keepdims=True))'
replace = 'e = np.exp(z)'

[[mutation]]
name = "softmax normalises by the grand total"
file = "moe.py"
pattern = 'return e / e.sum(axis=-1, keepdims=True)'
replace = 'return e / e.sum()'

[[mutation]]
name = "top-k picks the smallest entries"
file = "moe.py"
pattern = 'np.argpartition(-scores, k - 1, axis=1)[:, :k]'
replace = 'np.argpartition(scores, k - 1, axis=1)[:, :k]'

[[mutation]]
name = "top-k leaves the chosen indices unsorted"
file = "moe.py"
pattern = 'return np.sort(np.argpartition(-scores, k - 1, axis=1)[:, :k], axis=1)'
replace = 'return np.argpartition(-scores, k - 1, axis=1)[:, :k]'

