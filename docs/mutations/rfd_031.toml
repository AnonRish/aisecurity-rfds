# Seeded bugs for RFD 031. Run: python scripts/mutation_check.py 31
# Each entry breaks one claim of the README in one place; the package's tests must notice every one.

# ---- smt.py: the registry database ---------------------------------------------------------------------------------

[[mutation]]
name = "a leaf does not commit to where the key ends"
file = "smt.py"
pattern = 'b"\x00" + len(key).to_bytes(4, "big") + key + value'
replace = 'b"\x00" + key + value'

[[mutation]]
name = "a node hash ignores which child is left"
file = "smt.py"
pattern = 'return sha256(b"\x01" + left + right)'
replace = 'return sha256(b"\x01" + min(left, right) + max(left, right))'

[[mutation]]
name = "leaves and nodes share a hash domain"
file = "smt.py"
pattern = 'return sha256(b"\x01" + left + right)'
replace = 'return sha256(b"\x00" + left + right)'

[[mutation]]
name = "a key's position uses half the hash bits"
file = "smt.py"
pattern = '[: DEPTH // 8]'
replace = '[: DEPTH // 16]'

[[mutation]]
name = "a proof of absence is checked against the key's own leaf"
file = "smt.py"
pattern = 'h = EMPTY_LEAF if value is None else _leaf(key, value)'
replace = 'h = _leaf(key, value or b"")'

[[mutation]]
name = "a bitmap with bits beyond the depth is accepted"
file = "smt.py"
pattern = 'if proof.bitmap >> DEPTH or bin(proof.bitmap).count("1") != len(proof.siblings):'
replace = 'if bin(proof.bitmap).count("1") != len(proof.siblings):'

[[mutation]]
name = "a bitmap that disagrees with the siblings is accepted"
file = "smt.py"
pattern = 'or bin(proof.bitmap).count("1") != len(proof.siblings)'
replace = ''

[[mutation]]
name = "two keys at one position are not refused"
file = "smt.py"
pattern = 'if held is not None and held[0] != key:'
replace = 'if False:'

[[mutation]]
name = "get returns the value of a different key at the same position"
file = "smt.py"
pattern = 'return item[1] if item is not None and item[0] == key else None'
replace = 'return item[1] if item is not None else None'

[[mutation]]
name = "the empty map's root is not the default of full depth"
file = "smt.py"
pattern = 'return self._nodes.get((DEPTH, 0), _DEFAULTS[DEPTH])'
replace = 'return self._nodes.get((DEPTH, 0), EMPTY_LEAF)'

[[mutation]]
name = "proof size leaves out the bitmap"
file = "smt.py"
pattern = 'return DEPTH // 8 + 32 * len(self.siblings)'
replace = 'return 32 * len(self.siblings)'

